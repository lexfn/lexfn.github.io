base_url = "https://fdtv.me"
title = "Aleksey Fedotov"
compile_sass = true
build_search_index = true
generate_feeds = true

taxonomies = [{ name = "tags", feed = true, render = false }]

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[markdown.highlighting]
theme = "github-light"

[extra]

author = "Aleksey"
display_author = true
favicon = "/favicon.ico"

default_theme = "light"
list_pages = false

header_nav = [{ url = "/", name = "home" }, { url = "/posts", name = "posts" }]
